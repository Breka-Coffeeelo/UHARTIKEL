<script>
const TX={"1":{"h":"Aktivitas Ekstrak Manggis terhadap Virus Demam Berdarah Dengue","by":"Oleh: Teguh Hari Sucipto, Radinal Kautsar, Yuanita Rachmawati, dkk","p":["Infeksi demam berdarah merupakan penyakit yang disebabkan oleh virus dengue (DENV). Penyakit ini menular melalui gigitan nyamuk Aedes aegypti dan Aedes albopictus. Secara global, penyakit ini dianggap sebagai infeksi arboviral yang paling umum terjadi pada manusia. Lebih dari 2000 kematian disebabkan oleh infeksi demam berdarah, dan lebih dari 3,7 juta kasus demam berdarah dilaporkan secara global di beberapa negara pada akhir Agustus 2023. Data Organisasi Kesehatan Dunia (WHO) menunjukkan bahwa terjadi peningkatan kasus infeksi virus dengue sebesar 30 kali lipat di seluruh dunia dalam lima dekade terakhir. Penyebaran virus dengue terjadi lebih cepat di daerah tropis dan subtropis.","Delima merupakan salah satu jenis buah yang terkenal dan mudah ditemukan di Indonesia. Sayangnya konsumsi buah delima di Indonesia masih sangat rendah. Buah ini sering digunakan dalam pengobatan tradisional karena khasiatnya dalam mengobati batuk kering, gagal ginjal, wajah bengkak, kulit gatal, dan penyakit kuning. Selain itu, kulit buah delima juga bermanfaat untuk mengobati cacingan, diare, dan sakit tenggorokan. Aktivitas terapeutik buah delima disebabkan oleh adanya senyawa aktif dengan aktivitas biologis, seperti alkaloid, flavonoid, tanin, saponin, dan triterpenoid. Senyawa tersebut telah terbukti memiliki sifat biologis seperti sebagai antibakteri, antivirus, antikanker, dan antiinflamasi.","Penelitian ini bertujuan untuk mengetahui aktivitas antivirus terhadap virus dengue serotipe 3 (DENV-3) secara in vitro dan in silico. Buah delima diekstraksi menggunakan metanol 50% dan 75%, dengan kombinasi ekstrak buah-biji, kulit, dan kulit-biji buah. Aktivitas antivirus dan uji MTT dilakukan pada sel Vero. Secara in silico dilakukan pada kompleks protein NS5 (PDB ID: 5JJS). Hasil uji MTT menunjukkan ekstrak kombinasi kulit-biji buah dengan pelarut metanol 50% memiliki aktivitas sitotoksik terbaik dengan nilai sebesar 1085,73 μg/mL. Aktivitas antivirus terbaik berasal dari ekstrak buah-biji dengan pelarut metanol 75% dengan nilai sebesar 1,97 μg/mL.","Hasil penambatan molekuler menunjukkan bahwa senyawa yang terkandung dalam ekstrak buah delima mampu berikatan dengan kompleks protein NS5 pada virus dengue serotipe 3. Ellagitannin, peletierin, punicalagin, antosianin, dan asam epigalokatekin mempunyai nilai energi ikat (ΔG) terbaik. Senyawa ini berinteraksi dengan membentuk ikatan hidrogen, ikatan hidrofobik, dan ikatan elektrostatik dengan residu asam amino berbeda dalam domain terminal C protein NS5.","Dari kelima senyawa tersebut, hanya senyawa antosianin dan peletierin yang memenuhi parameter lima hukum Lipinski, sehingga dapat dilakukan pengujian lebih lanjut untuk digunakan sebagai calon obat DENV oral."]},"2":{"h":"Manfaat Teknologi AI dalam Kehidupan Sehari-hari","p":["Kecerdasan buatan (AI) telah menjadi bagian dari kehidupan sehari-hari, membantu manusia menyelesaikan berbagai tugas dengan lebih efisien. Artikel ini mengulas manfaat teknologi AI dalam bidang kesehatan, transportasi, dan pendidikan, yang semakin memudahkan aktivitas manusia.","Teknologi AI memberikan banyak manfaat yang signifikan bagi masyarakat:","<b>Kesehatan:</b> AI digunakan untuk menganalisis data medis, membantu dokter mendiagnosis penyakit dengan lebih akurat, dan menciptakan perangkat kesehatan seperti smartwatch yang memantau detak jantung secara real-time.","<b>Transportasi:</b> Di bidang transportasi, AI diaplikasikan pada kendaraan otonom dan sistem navigasi. Misalnya, mobil tanpa pengemudi yang dirancang untuk mengurangi kecelakaan di jalan.","<b>Pendidikan:</b> AI berkontribusi pada personalisasi pembelajaran, seperti aplikasi yang menyesuaikan materi sesuai kemampuan siswa, menjadikannya lebih efektif untuk proses belajar-mengajar.","Manfaat teknologi AI sangat terasa dalam berbagai aspek kehidupan, memberikan solusi inovatif untuk masalah sehari-hari. Pengembangan teknologi ini harus terus didukung untuk menciptakan kemajuan yang lebih baik bagi masyarakat."]},"3":{"h":"Dampak Perubahan Iklim terhadap Kehidupan Manusia","p":["Perubahan iklim telah menjadi salah satu isu global yang memengaruhi kehidupan manusia secara langsung. Artikel ini mengupas dampaknya pada kesehatan, ekosistem, dan pola hidup manusia, yang memerlukan perhatian serius dari berbagai pihak.","Perubahan iklim membawa sejumlah dampak signifikan, antara lain:","<b>Kesehatan:</b> Kenaikan suhu global menyebabkan gelombang panas yang meningkatkan risiko dehidrasi dan penyakit kardiovaskular. Selain itu, penyebaran penyakit tropis seperti malaria semakin meluas karena perubahan iklim.","<b>Ekosistem:</b> Ekosistem laut dan darat mengalami tekanan akibat pemanasan global. Misalnya, terumbu karang yang memutih akibat peningkatan suhu laut mengancam kehidupan biota laut.","<b>Pola hidup:</b> Perubahan iklim memengaruhi pola hidup manusia, seperti kebutuhan untuk menyesuaikan teknik bertani agar lebih tahan terhadap cuaca ekstrem.","Perubahan iklim memiliki dampak serius yang memerlukan tindakan segera, seperti pengurangan emisi karbon dan pelestarian lingkungan, demi keberlanjutan kehidupan manusia."]}};

async function begin(){

 if(!nm||!kl||!tk)return login("Nama, kelas, dan token wajib diisi.");

 const keluar=()=>{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
 audioInit();fs();
 let j;try{j=await GET({a:"start",tk,n:nm,k:kl})}catch(e){keluar();return login("Tidak dapat terhubung ke server. Periksa internet lalu coba lagi.")}
 if(!j.ok){keluar();return login(j.err==="token"?"Token ujian salah.":j.err==="closed"?"Ujian belum dibuka atau sudah ditutup oleh guru.":j.err==="dup"?"Kamu sudah mengerjakan ujian ini. Hubungi guru jika perlu mengulang.":"Gagal memulai ujian. Periksa nama dan kelas.")}

}
let AC=null;

["touchstart","pointerdown","click"].forEach(e=>document.addEventListener(e,()=>{if(AC&&AC.state!=="running")audioInit()},{passive:true}));

}
document.addEventListener("visibilitychange",()=>{if(document.hidden)v("Berpindah tab / aplikasi")});
addEventListener("blur",()=>setTimeout(()=>{if(S&&Date.now()-S.start>3000&&!document.hasFocus()&&!document.hidden)v("Jendela ujian kehilangan fokus",IS_MOBILE)},150));
document.addEventListener("fullscreenchange",()=>{if(S&&!S.done&&S.start&&!document.fullscreenElement&&document.documentElement.requestFullscreen)v("Keluar dari layar penuh")});
["copy","cut","paste","dragstart"].forEach(e=>document.addEventListener(e,x=>{if(S&&!S.done){x.preventDefault();v("Mencoba "+(e==="paste"?"menempel":"menyalin")+" teks")}}));
document.addEventListener("contextmenu",x=>{if(S&&!S.done){x.preventDefault();v("Klik kanan",1)}});
document.addEventListener("keydown",e=>{
 if(!S||S.done)return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
 if(k==="f12"||(c&&e.shiftKey&&["i","j","c"].includes(k))||(c&&["u","s","p","a","c","v","x","f"].includes(k))||k==="printscreen"){
  e.preventDefault();v("Pintasan terlarang: "+(c?"Ctrl+":"")+e.key,1);if(k==="printscreen"||k==="f12"||(c&&e.shiftKey))v("Mencoba tangkap layar / DevTools")}
});
addEventListener("beforeunload",e=>{if(S&&S.start&&!S.done){e.preventDefault();e.returnValue=""}});
// ===== SERVER =====
const GET=o=>fetch(SHEET_URL+"?"+new URLSearchParams(o)).then(r=>r.json());
const POST=o=>fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(r=>r.json());
const keyTx=(q,k)=>k==null?"":q.y==="pg"?q.o[k]:q.y==="m"?k.map(x=>q.o[x]).join("; "):q.r.map((r,j)=>r[0]+" → "+q.lab[k[j]]).join(" | ");
const ownTx=(q,a)=>a==null?"(kosong)":q.y==="pg"?q.o[a]:q.y==="m"?(a.length?a.map(x=>q.o[x]).join("; "):"(kosong)"):q.r.map((r,j)=>r[0]+" → "+(a[j]==null?"?":q.lab[a[j]])).join(" | ");
function finish(why){
 if(S.done)return;S.done=true;S.end=Date.now();S.why=why;save();clearInterval(timer);closeM();locked=false;
 try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
 result();kirim();setTimeout(hb,300);
}
const payload=()=>({a:"submit",id:S.id,sig:S.sig,n:S.nm,k:S.kl,w:Math.round((S.end-S.start)/60000),why:S.why,v:S.viol,A:Q.map((q,i)=>S.ans[i]==null?null:S.ans[i])});
const report=()=>btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));
async function kirim(){
 const say=t=>{const e=$("st");if(e)e.textContent=t};
 if(S.sent)return say("✓ Hasil sudah dikirim ke guru.");
 say("Mengirim jawaban ke server…");
 try{const j=await POST(payload());
  if(!j.ok)return say(j.err==="sig"?"Sesi ujian tidak valid. Kirim kode laporan ke guru.":"Server menolak pengiriman. Tekan “Kirim ulang” atau kirim kode laporan ke guru.");
  S.sent=1;S.res=j;save();result();
 }catch(e){say("Gagal mengirim. Periksa koneksi lalu tekan “Kirim ulang”, atau kirim kode laporan ke guru.")}
}
const levels=by=>Object.keys(L).map(c=>`<div>${L[c][0]}: <b>${by[c][0]}/${by[c][1]}</b></div><div class="bar"><i style="width:${by[c][0]/by[c][1]*100}%;background:${L[c][1]}"></i></div>`).join("");
function result(){
 const r=S.res,c=S.viol.filter(x=>!x.s).length,code=report();
 const nilai=r?`<p>Skor kamu (${N} soal):</p><div class="big">${r.skor}<span class="mu">/100</span></div><p>Benar ${r.sc} dari ${N} soal. Pelanggaran tercatat: ${c}, catatan ringan: ${S.viol.length-c}.</p>${levels(r.by)}`:`<p class="mu">Jawabanmu sedang dikirim dan dinilai oleh server…</p>`;
 let rv="";
 if(r){const list=Q.map((q,i)=>i).filter(i=>!SW||!r.rev[i].s);
  rv=`<h2 style="margin:18px 0 8px">Pembahasan ${N} soal</h2><button class="g" onclick="SW=!SW;result()">${SW?"Tampilkan semua soal":"Tampilkan hanya yang salah"}</button>`+list.map(i=>item(Q[i],i,S.ans[i],r.rev[i])).join("")}
 app.innerHTML=`<div class="w"><div class="c"><h1>Ujian selesai</h1><div class="mu">${esc(S.nm)} · ${esc(S.kl)} · ${esc(S.why)}</div>${nilai}</div>
 <div class="c"><h2>Pengiriman ke guru</h2><p id="st" class="mu">${S.sent?"✓ Hasil sudah dikirim ke guru.":""}</p><button class="g" onclick="kirim()">Kirim ulang</button><h2 style="margin-top:18px">Kode laporan (cadangan)</h2><p class="mu">Jika pengiriman gagal, salin kode ini dan kirim ke guru. Guru memeriksanya lewat Mode Guru.</p><pre id="cd">${code}</pre><button onclick="navigator.clipboard&&navigator.clipboard.writeText($('cd').textContent).then(()=>this.textContent='Tersalin ✓')">Salin kode</button> <button class="g" onclick="try{localStorage.removeItem(KEY)}catch(e){}S=null;login()">Keluar</button></div>${rv}</div>`;
}
function item(q,i,a,r){const st=r.s?'<span style="color:var(--ok)">✓ Benar</span>':'<span style="color:var(--er)">✗ Salah</span>';
 return `<div class="c" style="margin-top:14px"><b>No. ${i+1}</b> ${st} <span class="tag" style="background:${L[q.l][1]}">${L[q.l][0]}</span><p>${esc(q.t)}</p><div class="mu">Jawabanmu: ${esc(ownTx(q,a))}</div><div class="mu">Kunci: <b>${esc(keyTx(q,r.k))}</b></div></div>`}
// ===== MODE GURU =====
let GP="",lt=null;
const ga=async o=>GET({...o,pw:GP});
function teacher(){app.innerHTML=`<div class="w"><div class="c"><h1>Mode Guru</h1><label>Kata sandi guru<input id="pw" type="password" autocomplete="off"></label><button onclick="cekGuru()">Masuk</button> <button class="g" onclick="S?result():login()">Kembali</button><p id="er" style="color:var(--er)"></p></div></div>`}
async function cekGuru(){
 if(!SHEET_URL)return $("er").textContent="Alamat server (SHEET_URL) belum diisi di file HTML.";
 GP=$("pw").value;try{const j=await ga({a:"list"});if(j.err){GP="";return $("er").textContent="Kata sandi salah."}panel()}catch(e){$("er").textContent="Tidak dapat terhubung ke server."}}
function panel(){
 app.innerHTML=`<div class="w"><div class="c"><h1>Panel Kontrol</h1><div class="mu" id="cf">Memuat…</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button onclick="ctl('open')">Buka ujian</button><button class="d" onclick="ctl('close')">Tutup ujian</button><button class="g" onclick="tc('all','msg')">Pesan ke semua</button><button class="g" onclick="tc('all','add')">+ Waktu semua</button><button class="g" onclick="tc('all','kumpul')">Kumpulkan semua</button><button class="g" onclick="guruUI()">Periksa laporan</button><button class="g" onclick="clearInterval(lt);GP='';S?result():login()">Keluar</button></div></div><div class="c" id="lv"></div></div>`;
 pull();clearInterval(lt);lt=setInterval(pull,10000);
}
async function ctl(op){try{await ga({a:"ctl",op});pull()}catch(e){alert("Gagal menghubungi server.")}}
async function tc(id,op){let val="";
 if(op==="add"){val=prompt("Tambah berapa menit?","5");if(!val)return}
 if(op==="msg"){val=prompt("Isi pesan untuk siswa:");if(!val)return}
 if(op==="kumpul"&&!confirm("Paksa kumpulkan jawaban "+(id==="all"?"SEMUA siswa yang masih mengerjakan":"siswa ini")+"?"))return;
 if(op==="reset"&&!confirm("Reset siswa ini? Hasilnya dihapus dan ia harus masuk lagi."))return;
 try{await ga({a:"cmd",id,op,val});pull()}catch(e){alert("Gagal menghubungi server.")}}
function rowH(r,now){const ago=(now-r.t)/1000|0,st=r.d?"Selesai":ago>90?"Offline "+ago+" dtk":"Mengerjakan",col=r.d?"var(--ok)":ago>90?"var(--wa)":"var(--pr)";
 return `<div style="border-top:2px dashed var(--bd);padding:12px 0"><b>${esc(r.n)}</b> · ${esc(r.k)} <span class="tag" style="background:${col}">${st}</span>${r.skor!=null?` <span class="tag">skor ${r.skor}</span>`:""}
 <div class="mu">Soal ke-${r.i} · terjawab ${r.a}/${N} · sisa ${Math.floor(r.s/60)}:${String(r.s%60).padStart(2,"0")} · <b style="color:${r.v?"var(--er)":"inherit"}">pelanggaran ${r.v}/${MAX}</b></div>
 <div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="g" onclick="tc('${r.id}','add')">+ Waktu</button><button class="g" onclick="tc('${r.id}','msg')">Pesan</button><button class="g" onclick="tc('${r.id}','kumpul')">Kumpulkan</button><button class="g" onclick="tc('${r.id}','reset')">Reset</button></div></div>`}
async function pull(){if(!$("lv"))return clearInterval(lt);
 try{const j=await ga({a:"list"});if(j.err)return;
  $("cf").innerHTML="Status ujian: <b>"+(j.open?"DIBUKA":"DITUTUP")+"</b> · "+j.rows.length+" siswa tercatat · diperbarui tiap 10 detik";
  $("lv").innerHTML=j.rows.length?j.rows.sort((a,b)=>b.v-a.v||String(a.n).localeCompare(b.n)).map(r=>rowH(r,j.now)).join(""):'<span class="mu">Belum ada siswa yang masuk.</span>'}
 catch(e){$("lv").innerHTML='<span class="mu">Gagal memuat, mencoba lagi…</span>'}}
function guruUI(){clearInterval(lt);app.innerHTML=`<div class="w"><div class="c"><h1>Periksa Laporan</h1><p class="mu">Tempel kode laporan siswa (cadangan jika pengiriman otomatis gagal). Penilaian dihitung di server.</p><textarea id="cd" rows="5" placeholder="Tempel kode laporan…"></textarea><button onclick="decode()">Tampilkan</button> <button class="g" onclick="panel()">Kembali ke panel</button><div id="rp"></div></div></div>`}
const rpErr=t=>$("rp").innerHTML=`<p style="color:var(--er)">${t}</p>`;
async function decode(){
 let r;try{r=JSON.parse(decodeURIComponent(escape(atob($("cd").value.trim()))))}catch(e){return rpErr("Kode tidak valid.")}
 $("rp").innerHTML='<p class="mu">Menilai di server…</p>';
 try{const j=await POST({a:"decode",pw:GP,r});
  if(j.err)return rpErr(j.err==="auth"?"Kata sandi tidak valid. Masuk ulang.":"Kode tidak valid.");
  const c=j.v.filter(x=>!x.s).length,st=c>=MAX?["Dicurigai berat","var(--er)"]:c>0?["Perlu ditinjau","var(--wa)"]:["Aman","var(--ok)"];
  const sl=j.d.map((x,i)=>x?null:i+1).filter(Boolean);
  $("rp").innerHTML=`<hr><h2>${esc(j.n)} · ${esc(j.k)}</h2><p>Skor: <b>${j.skor}/100</b> (${j.sc}/${N}) · Durasi: ${j.w} menit · ${esc(j.why)}<br>Status: <b style="color:${st[1]}">${st[0]}</b> (${c} pelanggaran, ${j.v.length-c} catatan ringan)</p>${levels(j.by)}<p>Soal salah / kosong: <b>${sl.length?sl.join(", "):"tidak ada"}</b></p><h2>Log pelanggaran</h2>${j.v.length?j.v.map(x=>`<div class="mu">${esc(x.t)} — ${esc(x.m)} ${x.s?"(ringan)":""}</div>`).join(""):'<div class="mu">Tidak ada.</div>'}`;
 }catch(e){rpErr("Tidak dapat terhubung ke server.")}
}
// ===== KONTROL JARAK JAUH =====
async function hb(){
 if(!SHEET_URL||!S||!S.start)return;
 try{const left=Math.max(0,(S.start+DUR*60000+(S.extra||0)-Date.now())/1000|0);
  const j=await GET({a:"hb",id:S.id,n:S.nm,k:S.kl,i:(S.i||0)+1,q:Q.filter((_,x)=>ok(x)).length,v:S.viol.filter(x=>!x.s).length,s:S.done?0:left,d:S.done?1:0,t0:S.start});
  (j.cmds||[]).forEach(doCmd)}catch(e){}
}
function doCmd(c){
 if(!S)return;
 if(c.op==="add"&&!S.done){S.extra=(S.extra||0)+(+c.val||0)*60000;save();if($("tm"))tick()}
 if(c.op==="kumpul"&&!S.done)finish("Dikumpulkan oleh guru");
 if(c.op==="msg")modal(`<h2>Pesan dari guru</h2><p style="white-space:pre-line">${esc(c.val)}</p><button onclick="closeM()">Oke</button>`);
 if(c.op==="reset"){clearInterval(timer);try{localStorage.removeItem(KEY)}catch(e){}S=null;locked=false;closeM();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}login("Ujianmu direset oleh guru. Silakan masuk lagi.")}
}
setInterval(hb,25000);
// ===== MULAI =====
if(S&&S.done){result();if(!S.sent)kirim()}
else if(S&&S.start){S.viol.push({t:new Date().toLocaleTimeString("id-ID"),m:"Halaman dimuat ulang / ditutup saat ujian",s:0});save();
 if(S.viol.filter(x=>!x.s).length>=MAX)finish("Melebihi batas pelanggaran");
 else{run();locked=true;modal(`<h2 style="color:var(--er)">⚠ Halaman dimuat ulang</h2><p>Ini dicatat sebagai pelanggaran (${S.viol.filter(x=>!x.s).length}/${MAX}). Waktu ujian tetap berjalan.</p><button onclick="locked=false;closeM();audioInit();fs();last=Date.now()">Lanjutkan ujian</button>`)}}
else login();
</script>
</body>
</html>
